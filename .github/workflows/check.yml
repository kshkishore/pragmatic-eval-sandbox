name: Check submissions

on:
  push:
    paths: ["submissions/**", "checker/**", "reference/**", "tests/**", ".github/workflows/check.yml"]
  pull_request:
    paths: ["submissions/**"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Self-test against the thesis results
        run: python tests/test_against_thesis.py
      - name: Check every submission
        id: check
        run: python checker/check.py --all
        continue-on-error: true
      - name: Show the reports in the run summary
        if: always()
        run: |
          for f in submissions/*/REPORT.md; do cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo -e "\n---\n" >> "$GITHUB_STEP_SUMMARY"; done
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            submissions/*/REPORT.md
            submissions/*/report.json
      - name: Fail if any submission failed
        if: steps.check.outcome == 'failure'
        run: exit 1
